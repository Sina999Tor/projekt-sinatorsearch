      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Přijmout licence Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Sestavit APK
        working-directory: android-tv
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} assembleRelease

      - name: Připravit soubor
        run: |
          mkdir -p out
          cp android-tv/app/build/outputs/apk/release/app-release.apk out/SinatorTV.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SinatorTV-apk
          path: out/SinatorTV.apk

      - name: Zveřejnit jako nejnovější APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Sinator TV – nejnovější APK
          body: |
            Nejnovější sestavení aplikace pro Android TV / Google TV (WebView obal).
            Stáhni SinatorTV.apk a nainstaluj na TV. Nové verze se instalují přes starou, data appky zůstanou.
          files: out/SinatorTV.apk
          fail_on_unmatched_files: true

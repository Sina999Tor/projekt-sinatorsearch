name: Update EPG data

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout epg-data branch
        uses: actions/checkout@v4
        with:
          ref: epg-data
          fetch-depth: 1

      - name: Download czech3.xml
        run: |
          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -H "Referer: https://www.open-epg.com/" \
            "https://www.open-epg.com/files/czech3.xml" \
            -o czech3.xml 2>/dev/null || true

          if [ ! -s czech3.xml ] || [ $(wc -c < czech3.xml) -lt 10000 ]; then
            echo "open-epg.com selhal, zkouším zálohu..."
            curl -fsSL \
              "https://raw.githubusercontent.com/globetvapp/epg/main/Czech/czech3.xml" \
              -o czech3.xml 2>/dev/null || true
          fi

          echo "czech3.xml: $(wc -c < czech3.xml) bytes"

      - name: Download slovakia1.xml
        run: |
          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: application/xml,text/xml,*/*" \
            -H "Referer: https://www.open-epg.com/" \
            "https://www.open-epg.com/app/download.php?file=slovakia1.xml" \
            -o slovakia1.xml 2>/dev/null || true

          if [ ! -s slovakia1.xml ] || [ $(wc -c < slovakia1.xml) -lt 10000 ]; then
            echo "open-epg.com selhal, zkouším zálohu..."
            curl -fsSL \
              "https://raw.githubusercontent.com/globetvapp/epg/main/Slovakia/slovakia1.xml" \
              -o slovakia1.xml 2>/dev/null || true
          fi

          echo "slovakia1.xml: $(wc -c < slovakia1.xml) bytes"

      - name: Archive today's snapshot (rolling 7 days)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p "archive/$TODAY"
          [ -s czech3.xml ] && cp czech3.xml "archive/$TODAY/czech3.xml"
          [ -s slovakia1.xml ] && cp slovakia1.xml "archive/$TODAY/slovakia1.xml"
          echo "Archivováno pro $TODAY"

          # Smaž archivní dny starší než 7 dní zpátky
          CUTOFF=$(date -u -d "7 days ago" +%Y-%m-%d)
          if [ -d archive ]; then
            for dir in archive/*/; do
              [ -d "$dir" ] || continue
              d=$(basename "$dir")
              if [[ "$d" < "$CUTOFF" ]]; then
                echo "Mažu starý archiv: $d"
                rm -rf "$dir"
              fi
            done
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add czech3.xml slovakia1.xml
          git add -A archive
          if git diff --staged --quiet; then
            echo "Zadna zmena."
          else
            git commit -m "chore: update EPG data"
            git push origin epg-data
          fi
